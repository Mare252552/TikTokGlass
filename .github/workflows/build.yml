name: Build TikTokGlass
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tiktokglass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile device arm64 dylib and verify Mach-O
        run: bash scripts/build.sh
      - name: Clang static analysis
        run: bash scripts/analyze.sh
      - name: UIKit behavior smoke tests on iOS 26 simulator
        run: bash scripts/smoke.sh
      - name: Upload TikTokGlass dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokGlass-arm64-ios26
          path: |
            build/TikTokGlass.dylib
            build/SHA256SUMS
            build/binary-info.txt
            build/load-commands.txt
            build/toolchain.txt
            build/smoke-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="2.0.0-${GITHUB_SHA:0:7}"
          gh release create "$TAG" --target "$GITHUB_SHA" build/TikTokGlass.dylib build/SHA256SUMS build/binary-info.txt build/toolchain.txt build/smoke-results.json --title "TikTokGlass 2.0.0 — experimental" --prerelease --notes "TikTokGlass 2.0: floating native UITabBar when all five original actions/images can be bridged safely; original controls with real draggable UIGlassEffect lens otherwise. The custom fallback is not certified as Apple's exact UITabBar animation. Compiled for device arm64, binary checked, Clang analyzed, and synthetic UIKit tested. TikTok 47.9.0, actual native drag/refraction and all-page coverage have NOT been tested on a physical iPhone. Existing settings/Sideloadly compatibility retained. See README."
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build/
