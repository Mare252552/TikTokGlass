name: Build TikTokGlass
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile device arm64 dylib and verify Mach-O
        run: bash scripts/build.sh
      - name: Clang static analysis
        run: bash scripts/analyze.sh
      - name: UIKit behavior smoke tests on iOS 26 simulator
        run: bash scripts/smoke.sh
      - name: Upload TikTokGlass dylib
        uses: actions/upload-artifact@v4
        with:
          name: TikTokGlass-arm64-ios26
          path: |
            build/TikTokGlass.dylib
            build/SHA256SUMS
            build/binary-info.txt
            build/load-commands.txt
            build/toolchain.txt
            build/smoke-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish experimental release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "2.0.0-experimental" --target "$GITHUB_SHA" build/TikTokGlass.dylib build/SHA256SUMS build/binary-info.txt build/toolchain.txt build/smoke-results.json --title "TikTokGlass 2.0.0 — experimental" --prerelease --notes "Native UIGlassEffect injection module for iOS 26+. Compiled for device arm64 with binary checks, Clang static analysis and synthetic UIKit simulator tests. TikTok 47.9.0 and iPhone 17 Pro have NOT been tested on a physical device. Read README and docs/COMPATIBILITY.md before installation."
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build/
